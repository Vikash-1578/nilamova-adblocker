<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <title>⚠️ Khatarnak site roki gayi</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a0f10; color: #f3eaea;
      font: 16px/1.5 system-ui, "Noto Sans Devanagari", sans-serif; }
    .card { max-width: 520px; padding: 32px; background: #241517; border: 1px solid #4a2326; border-radius: 16px; text-align: center; }
    h1 { margin: 8px 0; font-size: 24px; }
    .icon { font-size: 56px; }
    code { display: block; margin: 14px 0; padding: 10px; background: #120a0b; border-radius: 8px; word-break: break-all; color: #ff9c9c; }
    p { color: #cdb8b9; }
    .btns { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
    button { font: inherit; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
    #back { background: #e5484d; color: #fff; }
    #go { background: transparent; color: #a8999a; border: 1px solid #4a2326; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <h1>Ye site khatarnak ho sakti hai</h1>
    <p>Nilamova Ad Blocker ne ise roka hai. Ye site malware, scam ya nakli download ke liye jaani jaati hai.<br>
       <small>This site is known for malware, scams or fake downloads.</small></p>
    <code id="url"></code>
    <div class="btns">
      <button id="back">← Wapas jao (safe)</button>
      <button id="go">Mujhe pata hai, fir bhi kholo</button>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
